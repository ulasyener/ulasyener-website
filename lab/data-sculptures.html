<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data Sculptures</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400;600&display=swap">
<style>
:root{ --bg:#040405; --ink:#f2f2f0; --mid:#8d8d8a; --low:#4a4a48; --line:#2a2a29; --red:#ff3b2f; color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#040405; --ink:#f2f2f0; --mid:#8d8d8a; --low:#4a4a48; --line:#2a2a29; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#040405; --ink:#f2f2f0; --mid:#8d8d8a; --low:#4a4a48; --line:#2a2a29; color-scheme:dark; }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; margin:0; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ background:var(--bg); color:var(--ink); font-family:'Kode Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:10.5px; line-height:1.45; overflow:hidden; letter-spacing:.02em; }
#stage{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
#stage:active{ cursor:grabbing; }
#ov{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; }
#ov line, #ov polyline{ stroke:var(--ink); stroke-width:.6; fill:none; opacity:.55; }
#ov .hot{ stroke:var(--red); opacity:.95; }
#ov rect.dot{ fill:var(--ink); }
#ov rect.hot{ fill:var(--red); stroke:none; }
.tag{ position:fixed; z-index:3; pointer-events:none; border:.6px solid rgba(242,242,240,.5); padding:3px 6px 3px; white-space:nowrap; background:rgba(4,4,5,.55); transform:translate(0,-50%); min-width:78px; }
.tag b{ font-weight:600; font-size:11.5px; letter-spacing:.08em; }
.tag span{ display:block; color:var(--mid); }
.tag.hot{ border-color:var(--red); } .tag.hot b{ color:var(--red); }
.ring{ position:fixed; z-index:3; pointer-events:none; color:var(--mid); transform:translate(6px,-50%); white-space:nowrap; font-size:9.5px; }
.hud{ position:fixed; z-index:3; pointer-events:none; color:var(--mid); }
.hud h1{ margin:0 0 6px; font-size:11.5px; font-weight:600; color:var(--ink); letter-spacing:.1em; }
.tl{ left:22px; top:calc(20px + env(safe-area-inset-top,0px)); max-width:300px; }
.tl p{ margin:0; }
.tr{ right:22px; top:calc(20px + env(safe-area-inset-top,0px)); text-align:right; }
.tr table{ border-collapse:collapse; margin-left:auto; }
.tr td{ padding:0 0 0 14px; } .tr tr.hot td{ color:var(--red); } .tr td:first-child{ color:var(--low); } .tr td:nth-child(2){ color:var(--ink); }
.bar{ position:fixed; left:22px; right:22px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); display:flex; align-items:center; gap:16px; z-index:4; }
.seg{ display:flex; border:.6px solid var(--low); }
.seg button, .play{ all:unset; cursor:pointer; padding:5px 10px; color:var(--mid); font-size:10.5px; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
.play{ border:.6px solid var(--low); min-width:58px; text-align:center; }
.seg button:focus-visible,.play:focus-visible{ outline:1px solid var(--red); outline-offset:2px; }
.scrub{ flex:1; min-width:60px; appearance:none; -webkit-appearance:none; height:20px; background:transparent; margin:0; }
.scrub::-webkit-slider-runnable-track{ height:1px; background:var(--low); }
.scrub::-moz-range-track{ height:1px; background:var(--low); }
.scrub::-webkit-slider-thumb{ -webkit-appearance:none; width:3px; height:15px; background:var(--red); margin-top:-7px; }
.scrub::-moz-range-thumb{ width:3px; height:15px; border:0; border-radius:0; background:var(--red); }
.when{ min-width:120px; text-align:right; color:var(--ink); }
.frame{ position:fixed; inset:10px; border:.6px solid var(--line); pointer-events:none; z-index:1; }
@media (max-width:760px){ .tr{ display:none; } .tl{ max-width:230px; } .tag span:nth-child(n+3){ display:none; } .when{ min-width:0; } }
#nav{ display:flex; flex-direction:column; gap:0; margin-top:14px; pointer-events:auto; width:max-content; }
#nav button{ all:unset; cursor:pointer; padding:1px 0; color:var(--low); font-size:10px; letter-spacing:.1em; }
#nav button i{ font-style:normal; display:inline-block; width:26px; }
#nav button:hover{ color:var(--mid); }
#nav button[aria-current="true"]{ color:var(--ink); }
#nav button[aria-current="true"] i{ color:var(--red); }
#nav button:focus-visible{ outline:1px solid var(--red); outline-offset:2px; }
.fr{ position:fixed; z-index:3; pointer-events:none; transform:translate(-13px,-13px); white-space:nowrap; color:var(--mid); font-size:9px; }
.fr i{ display:block; width:26px; height:26px; border:.6px solid rgba(242,242,240,.8); }
.fr span{ position:absolute; left:32px; top:7px; background:rgba(4,4,5,.5); }
@media (max-width:760px){ #nav{ flex-direction:row; gap:12px; } #nav button i{ width:20px; } }
.tag{ pointer-events:auto; cursor:pointer; }
.tag:hover{ border-color:var(--ink); }
.tag.on{ background:var(--ink); border-color:var(--ink); } .tag.on b, .tag.on span{ color:var(--bg); }
.tag.on.hot{ background:var(--red); border-color:var(--red); }
.ixr{ position:fixed; z-index:3; pointer-events:none; width:18px; height:18px; transform:translate(-9px,-9px); border:.6px solid var(--ink); }
.tag,.hud.tr{ display:none!important; } @media (max-height:760px){ #nav{ max-height:calc(100vh - 250px); overflow-y:auto; scrollbar-width:thin; } } #ov polyline:not(.chain), #ov rect{ display:none; }
</style>
</head>
<body>

<div class="hud tl"><h1 id="title"></h1><p id="desc"></p><p id="count" style="margin-top:6px"></p><nav id="nav" aria-label="Sculptures"></nav></div>

  <input class="scrub" id="scrub" type="range" min="8" max="51" step="0.01" value="51" aria-label="Time">
  <div class="when" id="when"></div>
</div>
