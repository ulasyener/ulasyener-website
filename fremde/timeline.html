<style>
:root{--paper:#ECE9E1;--ink:#222A2A;--bone:#E2DAC2;--tr:#E8543C;--de:#E6C24A;--mig:#E39A3C}

body{background:#1B2121;color:var(--bone);font-family:'Satoshi',sans-serif;overflow:hidden}

#vig,#grain,#cracksvg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#cracksvg{opacity:calc(var(--age,0)*.9);mix-blend-mode:screen}
#vig{background:radial-gradient(ellipse at 50% 45%,transparent 38%,rgba(10,8,4,.55) 100%);opacity:calc(var(--age,0)*.6)}
#grain{opacity:calc(var(--age,0)*.32);mix-blend-mode:overlay;background-size:180px 180px;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
#scrim{position:absolute;inset:0;z-index:2;background:linear-gradient(100deg,rgba(20,25,25,.82) 0%,rgba(20,25,25,.5) 42%,rgba(20,25,25,.12) 70%,rgba(20,25,25,.35) 100%)}
#ghost{position:absolute;z-index:3;right:3vw;top:1vh;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30vh;line-height:1;color:var(--bone);opacity:.9;pointer-events:none;user-select:none;transition:color .4s;text-shadow:0 3px 40px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
#info{position:absolute;z-index:3;left:6vw;top:20vh;max-width:min(600px,58vw);display:flex;flex-direction:column;align-items:flex-start}
#kick{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.28em;margin-bottom:14px}
#title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(32px,6vw,72px);line-height:1;letter-spacing:-.02em;text-shadow:0 2px 30px rgba(0,0,0,.4);margin:0 0 16px;min-height:1em}
#note{font-size:15.5px;line-height:1.55;color:#d7d0bd;margin:0 0 16px}
#desclang{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.24em;color:rgba(226,218,194,.5);margin-bottom:6px;min-height:1em}
#desc{font-family:'Special Elite',monospace;font-size:14px;line-height:1.95;letter-spacing:.01em;margin:0 0 16px;min-height:1.95em;max-height:148px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 76%,transparent 100%);mask-image:linear-gradient(180deg,#000 76%,transparent 100%)}
#desc span.hi{background:rgba(255,255,255,.5);color:var(--ink);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:2px 6px;border-radius:1px}
#desc .dud{color:rgba(34,42,42,.42)}
#go{margin-top:22px;display:inline-block;font-family:'DM Mono',monospace;font-size:12.5px;letter-spacing:.05em;color:var(--ink);text-decoration:none;background:rgba(255,255,255,.48);padding:8px 16px 7px;clip-path:polygon(1% 13%,18% 5%,40% 9%,62% 3%,84% 8%,99% 4%,99% 84%,81% 96%,59% 92%,37% 97%,15% 93%,1% 88%);transition:background .15s,transform .15s}
#go:hover{background:rgba(255,255,255,.7);transform:translateY(-1px)}
#strip{position:absolute;z-index:3;left:0;right:0;bottom:0;height:230px;padding:0 3vw}
#line{position:absolute;left:4%;right:4%;bottom:84px;height:1px;background:rgba(226,218,194,.3)}
.ygroup{position:absolute;bottom:84px;width:0}
.circ{position:absolute;left:0;bottom:calc(var(--k,0)*46px);width:38px;height:38px;border-radius:50%;transform:translate(-50%,50%);border:2px solid var(--cc);background:#2a3231 center/cover no-repeat;overflow:hidden;cursor:pointer;transition:opacity .25s,width .18s,height .18s,box-shadow .18s;z-index:2}
.circ.stack{opacity:0;pointer-events:none}
.ygroup:hover .circ.stack{opacity:1;pointer-events:all}
.circ.on{border-color:var(--bone);box-shadow:0 0 0 2px rgba(226,218,194,.25),0 5px 18px rgba(0,0,0,.5);opacity:1 !important;pointer-events:all}
.circ:hover{width:58px;height:58px;z-index:7;box-shadow:0 6px 22px rgba(0,0,0,.6)}
.circ .cov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,25,25,.62);transition:opacity .22s}
.circ .cov span{font-family:'DM Mono',monospace;font-weight:500;font-size:10.5px;color:var(--bone)}
.circ:hover .cov,.circ.on .cov{opacity:0}
.circ.noimg .cov{background:rgba(20,25,25,.35)}.circ.noimg .cov span{color:var(--cc)}
#photoby{position:absolute;z-index:3;left:3vw;bottom:15px;font-family:'DM Mono';font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:rgba(226,218,194,.55)}
#photoby a{color:inherit}
#legend{position:absolute;z-index:3;right:3vw;bottom:15px;font-family:'DM Mono';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(226,218,194,.6);display:flex;gap:14px}
#legend span{cursor:pointer;user-select:none;transition:opacity .2s}
#legend span.off{opacity:.32}
#legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
#mobile{display:none}
@media(max-width:640px){
html,body{height:auto;overflow-y:auto;overflow-x:hidden}
#stage{display:none}
#mobile{display:block;min-height:100vh;padding-bottom:40px}
.m-hero{padding:24px 18px 12px;position:sticky;top:0;background:#1B2121;z-index:2;border-bottom:1px solid rgba(226,218,194,.14)}
.m-hero h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em}
.m-hero .sub{font-family:'DM Mono',monospace;font-size:11px;color:#909B9A;letter-spacing:.2em;margin-top:4px}
.m-card{padding:18px}
.m-card+.m-card{border-top:1px solid rgba(226,218,194,.1)}
.m-card .yr{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:36px;line-height:1;color:var(--cc)}
.m-card .tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--cc);display:inline-block;margin:3px 0 8px}
.m-card img{width:100%;border-radius:6px;display:block;margin:8px 0;filter:contrast(1.03)}
.m-card h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;margin:6px 0}
.m-card p{font-size:14px;line-height:1.5;color:#d7d0bd;margin:0}
.m-card .cr{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6D7A79;margin-top:10px}
.m-card .cr a{color:inherit}
}

<script>
const CLR={"TR-POL":"#E8543C","DE-POL":"#E6C24A","MIG":"#E39A3C"},LBL={"TR-POL":"TURKEY","DE-POL":"GERMANY","MIG":"MIGRATION · MEDIA"};

/* [year, flow, title_en, note, image, slug, hasPage, credit, desc_en, desc_de, desc_tr, title_de, title_tr] */
const EV=[
[1923,"TR-POL","Proclamation of the Republic","The Republic of Turkey is founded.","1923.webp","republic-1923",0,"AA",
 `On 29 October 1923, the Grand National Assembly proclaimed the Republic of Turkey, with Mustafa Kemal (Atatürk) as its first president, ending the Ottoman Empire's six-century rule.`,
 `Am 29. Oktober 1923 rief die Große Nationalversammlung die Republik Türkei aus und beendete damit die sechshundertjährige Herrschaft des Osmanischen Reiches; erster Präsident wurde Mustafa Kemal (Atatürk).`,
 `29 Ekim 1923'te Büyük Millet Meclisi, Osmanlı İmparatorluğu'nun altı asırlık hakimiyetine son vererek Türkiye Cumhuriyeti'ni ilan etti; ilk cumhurbaşkanı Mustafa Kemal (Atatürk) oldu.`,
 `Ausrufung der Republik`,`Cumhuriyet'in İlanı`],
[1939,"DE-POL","The Second World War begins","War across Europe; it would leave Germany ruined and divided.","1939.jpg","wwii-1939",0,"Hugo Jaeger",
 `Germany's invasion of Poland on 1 September 1939 triggered the Second World War, which would leave the country divided, occupied, and in ruins by 1945.`,
 `Der deutsche Überfall auf Polen am 1. September 1939 löste den Zweiten Weltkrieg aus, der das Land bis 1945 in Trümmern, unter Besatzung und geteilt zurücklassen sollte.`,
 `Almanya'nın 1 Eylül 1939'da Polonya'yı işgali, İkinci Dünya Savaşı'nı başlattı; savaş 1945'e gelindiğinde ülkeyi harabeye çevirecek, işgal altına alacak ve bölecekti.`,
 `Der Zweite Weltkrieg beginnt`,`İkinci Dünya Savaşı Başlıyor`],
[1945,"DE-POL","End of the war · a divided Germany","The war ends; Germany is occupied and split — the prelude to the 1949 BRD/DDR division.","1945.avif","germany-divided-1945",0,"Yevgeny Khaldei",
 `Germany surrendered unconditionally on 8 May 1945; the victorious Allies divided the country into four occupation zones, a split that hardened into the postwar East–West division.`,
 `Am 8. Mai 1945 kapitulierte Deutschland bedingungslos; die siegreichen Alliierten teilten das Land in vier Besatzungszonen — eine Teilung, die sich zur späteren Ost-West-Spaltung verfestigte.`,
 `Almanya, 8 Mayıs 1945'te koşulsuz teslim oldu; galip müttefikler ülkeyi dört işgal bölgesine ayırdı — bu bölünme, savaş sonrası Doğu-Batı ayrımına dönüşecekti.`,
 `Kriegsende · ein geteiltes Deutschland`,`Savaşın Sonu · Bölünmüş Bir Almanya`],
[1949,"DE-POL","The Federal Republic (BRD)","The Grundgesetz is proclaimed; West Germany is founded.","1949_bdr.jpg","brd-1949",0,"AP",
 `On 23 May 1949, the Basic Law (Grundgesetz) was proclaimed and the Federal Republic of Germany (West Germany) was founded from the American, British, and French occupation zones.`,
 `Am 23. Mai 1949 wurde das Grundgesetz verkündet und die Bundesrepublik Deutschland aus der amerikanischen, britischen und französischen Besatzungszone gegründet.`,
 `23 Mayıs 1949'da Temel Yasa (Grundgesetz) ilan edildi ve Amerikan, İngiliz ve Fransız işgal bölgelerinden Federal Almanya Cumhuriyeti (Batı Almanya) kuruldu.`,
 `Die Bundesrepublik (BRD)`,`Federal Almanya Cumhuriyeti (BRD)`],
[1949,"DE-POL","Founding of the GDR","East Germany is founded.","1949_ddr.webp","ddr-1949",0,"NDR",
 `On 7 October 1949, the German Democratic Republic (East Germany) was founded in the Soviet occupation zone, formalizing the country's Cold War division.`,
 `Am 7. Oktober 1949 wurde in der sowjetischen Besatzungszone die Deutsche Demokratische Republik gegründet — die Teilung des Landes im Kalten Krieg war damit besiegelt.`,
 `7 Ekim 1949'da Sovyet işgal bölgesinde Alman Demokratik Cumhuriyeti (Doğu Almanya) kuruldu; bu, ülkenin Soğuk Savaş dönemi bölünmesini resmileştirdi.`,
 `Gründung der DDR`,`Doğu Almanya'nın Kuruluşu`],
[1959,"MIG","Bizim Radyo (Leipzig)","The Turkish Communist Party's clandestine radio, broadcasting from the GDR (1959–1989); Turks in West Germany were part of its audience.","1958_bizimradio.jpg","bizim-radyo-1959",0,"TÜSTAV",
 `"Bizim Radyo" ("Our Radio"), a clandestine Turkish Communist Party station, broadcast from Leipzig in the GDR from 1958 to 1989 — initially overseen by the poet Nâzım Hikmet. From 1961 it found a new audience among Turkish workers arriving in West Germany, whose reception Ankara repeatedly, unsuccessfully protested.`,
 `„Bizim Radyo" („Unser Radio"), ein klandestiner Sender der Kommunistischen Partei der Türkei, sendete von 1958 bis 1989 aus Leipzig in der DDR — zunächst unter der Leitung des Dichters Nâzım Hikmet. Ab 1961 fand er ein neues Publikum unter den nach Westdeutschland kommenden türkischen Arbeitern; Ankara protestierte wiederholt, aber erfolglos, dagegen.`,
 `"Bizim Radyo," Türkiye Komünist Partisi'ne bağlı gizli bir yayın organı olarak 1958-1989 arasında Leipzig'den (Doğu Almanya) yayın yaptı; başlangıçta şair Nâzım Hikmet'in gözetiminde kuruldu. 1961'den itibaren Batı Almanya'ya gelen Türk işçiler arasında yeni bir dinleyici kitlesi buldu; Ankara bu yayınları defalarca, sonuçsuz biçimde protesto etti.`,
 `Bizim Radyo (Leipzig)`,`Bizim Radyo (Leipzig)`],
[1960,"TR-POL","The 27 May coup","Military coup in Turkey.","1960.webp","27-may-1960",0,"AA",
 `On 27 May 1960, the Turkish Armed Forces staged the country's first military coup, overthrowing the government of Prime Minister Adnan Menderes, who was later tried and executed.`,
 `Am 27. Mai 1960 führte das türkische Militär den ersten Staatsstreich des Landes durch und stürzte die Regierung von Ministerpräsident Adnan Menderes, der später vor Gericht gestellt und hingerichtet wurde.`,
 `27 Mayıs 1960'ta Türk Silahlı Kuvvetleri, ülkenin ilk askeri darbesini gerçekleştirerek Başbakan Adnan Menderes hükümetini devirdi; Menderes daha sonra yargılanıp idam edildi.`,
 `Der Putsch vom 27. Mai`,`27 Mayıs Darbesi`],
[1961,"MIG","Construction of the Berlin Wall","The same year labour was being recruited from the West.","1961_berlinwall.webp","berlin-wall-1961",0,"Bundesregierung / Lehnartz",
 `Starting on 13 August 1961, East Germany sealed the border between East and West Berlin with barbed wire and, soon after, a concrete wall — a physical division that would stand for 28 years.`,
 `Ab dem 13. August 1961 riegelte die DDR die Grenze zwischen Ost- und West-Berlin zunächst mit Stacheldraht, bald darauf mit einer Betonmauer ab — eine physische Teilung, die 28 Jahre bestehen sollte.`,
 `13 Ağustos 1961'den itibaren Doğu Almanya, Doğu ve Batı Berlin arasındaki sınırı dikenli tellerle, kısa süre sonra da beton bir duvarla kapattı — 28 yıl ayakta kalacak fiziksel bir bölünme.`,
 `Bau der Berliner Mauer`,`Berlin Duvarı'nın İnşası`],
[1961,"MIG","The Labour Recruitment Agreement","The official beginning of the migration (30 October 1961) — the axis of this archive.","1961.jpg","recruitment-agreement-1961",0,"DPA",
 `On 30 October 1961, West Germany and Turkey signed a labour recruitment agreement — the official beginning of the migration this archive traces. Conceived as temporary "guest work," it became the foundation of a permanent Turkish-German community.`,
 `Am 30. Oktober 1961 unterzeichneten die Bundesrepublik und die Türkei das Anwerbeabkommen — der offizielle Beginn der Migration, der dieses Archiv folgt. Ursprünglich als befristete „Gastarbeit" gedacht, wurde daraus das Fundament einer dauerhaften türkisch-deutschen Gemeinschaft.`,
 `30 Ekim 1961'de Batı Almanya ile Türkiye arasında işçi alım anlaşması imzalandı — bu arşivin izini sürdüğü göçün resmi başlangıcı. Geçici bir "misafir işçilik" olarak tasarlanan bu anlaşma, kalıcı bir Türk-Alman toplumunun temelini attı.`,
 `Das Anwerbeabkommen`,`İşçi Alım Anlaşması`],
[1964,"MIG","Cologne Radio","The first Turkish-language broadcast on WDR (2 November 1964).","1964_kolnradyo.jpg","cologne-radio-1964",0,"Anonymous",
 `On 2 November 1964, WDR launched "Köln Radyosu," the first Turkish-language programme broadcast by a German public broadcaster — for decades, until satellite television, the main source of news from Turkey for migrant workers and their families.`,
 `Am 2. November 1964 startete der WDR mit „Köln Radyosu" die erste türkischsprachige Sendung eines deutschen öffentlich-rechtlichen Senders — jahrzehntelang, bis zum Satellitenfernsehen, die wichtigste Nachrichtenquelle aus der Türkei für Gastarbeiter und ihre Familien.`,
 `2 Kasım 1964'te WDR, bir Alman kamu yayın kuruluşunun yayınladığı ilk Türkçe program olan "Köln Radyosu"nu başlattı — uydu televizyonuna kadar geçen onlarca yıl boyunca göçmen işçiler ve aileleri için Türkiye'den haberlerin başlıca kaynağı oldu.`,
 `Köln Radyosu`,`Köln Radyosu`],
[1964,"MIG","Türkofon founded","One of the first Turkish record labels in Germany (Cologne); Türküola followed.","1964_turkofon.jpg","turkofon-1964",0,"Anonymous",
 `In 1964, Yılmaz Asöcal founded Türkofon (soon renamed Türküola) in Cologne — the first, and for years the most successful, independent Turkish record label in Germany, releasing over a thousand titles including songs by Yüksel Özkasap, "the Nightingale of Cologne."`,
 `1964 gründete Yılmaz Asöcal in Köln Türkofon (bald umbenannt in Türküola) — das erste und über Jahre erfolgreichste unabhängige türkische Plattenlabel in Deutschland, mit über tausend veröffentlichten Titeln, darunter Yüksel Özkasap, „die Nachtigall von Köln."`,
 `1964'te Yılmaz Asöcal, Köln'de Türkofon'u kurdu (kısa süre sonra Türküola adını aldı) — Almanya'daki ilk ve yıllarca en başarılı bağımsız Türk plak şirketi; "Köln'ün Bülbülü" Yüksel Özkasap dahil binin üzerinde eser yayımladı.`,
 `Gründung von Türkofon`,`Türkofon'un Kuruluşu`],
[1967,"MIG","Voice of the TKP","Broadcast from abroad; compilations are open at TÜSTAV.","1967_tkpninsesi.jpg","voice-of-tkp-1967",0,"TÜSTAV",
 `Exile broadcasts aligned with the Turkish Communist Party continued to reach Turkish workers abroad through the late 1960s; compilations of these recordings are held today at TÜSTAV, the Turkey Social History Research Foundation.`,
 `Exilsendungen im Umfeld der Kommunistischen Partei der Türkei erreichten Ende der 1960er Jahre weiterhin türkische Arbeiter im Ausland; Zusammenstellungen dieser Aufnahmen befinden sich heute im TÜSTAV (Stiftung für Sozialgeschichtsforschung der Türkei).`,
 `Türkiye Komünist Partisi çizgisindeki sürgün yayınları 1960'ların sonunda yurt dışındaki Türk işçilere ulaşmaya devam etti; bu kayıtların derlemeleri bugün TÜSTAV'da (Türkiye Sosyal Tarih Araştırma Vakfı) bulunuyor.`,
 `Die Stimme der TKP`,`TKP'nin Sesi`],
[1969,"MIG","Avrupa Hürriyet","Its German edition began in Munich (Frankfurt from 1971).","1969_hurriyet.png","avrupa-hurriyet-1969",0,"Anonymous",
 `From 1969 the Turkish daily Hürriyet began printing a dedicated European edition in Munich to reach the growing "guest worker" readership; from 1971 Frankfurt became its European headquarters, from where it was distributed across Germany and the rest of Europe.`,
 `Ab 1969 druckte die türkische Tageszeitung Hürriyet in München eine eigene Europa-Ausgabe, um die wachsende Leserschaft der „Gastarbeiter" zu erreichen; ab 1971 wurde Frankfurt zur Europazentrale, von wo aus die Verteilung in Deutschland und im übrigen Europa erfolgte.`,
 `1969'dan itibaren Hürriyet gazetesi, artan "misafir işçi" okur kitlesine ulaşmak için Münih'te ayrı bir Avrupa baskısı basmaya başladı; 1971'den itibaren Frankfurt Avrupa merkezi oldu, buradan Almanya'ya ve Avrupa'nın geri kalanına dağıtım yapıldı.`,
 `Avrupa Hürriyet`,`Avrupa Hürriyet`],
[1971,"TR-POL","The 12 March memorandum","Military memorandum in Turkey.","1971.webp","12-march-1971",0,"Anonymous",
 `On 12 March 1971, the Turkish military issued an ultimatum forcing the government's resignation — a period of martial law and political repression followed.`,
 `Am 12. März 1971 stellte das türkische Militär ein Ultimatum, das den Rücktritt der Regierung erzwang — es folgte eine Zeit des Kriegsrechts und politischer Repression.`,
 `12 Mart 1971'de Türk ordusu bir muhtıra yayımlayarak hükümetin istifasını sağladı — bunu bir sıkıyönetim ve siyasi baskı dönemi izledi.`,
 `Das Memorandum vom 12. März`,`12 Mart Muhtırası`],
[1973,"MIG","Ford strike · Cologne","24–30 August 1973: a 'wildcat strike' at the Ford Cologne plant, led by the Turkish workers who made up a third of the workforce. A turning point in migrant-labour history.","1973_fordstreik.jpg","ford-strike-1973",0,"Gernot Huber",
 `From 24 to 31 August 1973, Turkish workers — a third of Ford Cologne's 12,000-strong workforce — staged an unauthorized "wildcat" strike after around 300 colleagues were dismissed for returning late from summer leave in Turkey. Their demands included higher pay and a slower assembly line; hostile press coverage helped defeat the action, but it remains one of the largest labour disputes led by migrant workers in German history.`,
 `Vom 24. bis 31. August 1973 traten türkische Arbeiter — ein Drittel der 12.000-köpfigen Belegschaft bei Ford Köln — in einen nicht genehmigten „wilden Streik", nachdem rund 300 Kollegen wegen verspäteter Rückkehr aus dem Türkei-Urlaub entlassen worden waren. Ihre Forderungen umfassten mehr Lohn und ein langsameres Fließband; eine feindselige Presseberichterstattung trug zum Scheitern bei, dennoch gilt die Aktion als einer der größten von Migrant:innen geführten Arbeitskämpfe der deutschen Geschichte.`,
 `24-31 Ağustos 1973 arasında, Ford Köln'ün 12.000 kişilik işgücünün üçte birini oluşturan Türk işçiler, Türkiye'deki yaz izninden geç döndükleri için yaklaşık 300 arkadaşlarının işten çıkarılması üzerine izinsiz bir "vahşi grev" başlattı. Talepleri arasında daha yüksek ücret ve daha yavaş bant hızı vardı; düşmanca basın yayını grevin bastırılmasına katkıda bulundu, ama bu eylem Alman tarihinde göçmen işçilerin öncülük ettiği en büyük iş uyuşmazlıklarından biri olarak kaldı.`,
 `Ford-Streik · Köln`,`Ford Grevi · Köln`],
[1980,"TR-POL","The 12 September coup","Associated with a new wave of political migration.","1980.jpg","12-september-1980",0,"Anonymous",
 `On 12 September 1980, the Turkish military seized power in the country's third coup in twenty years, dissolving parliament and banning political parties — a new wave of political emigration to Germany and elsewhere followed.`,

[1982,"MIG","Semra Ertan","24 May 1982, Hamburg: the worker-poet Semra Ertan took her own life in a public protest against rising racism and the conditions of migrants in Germany. She left behind more than 350 poems.","1982_semraertan.jpg","semra-ertan-1982",0,"Renk Magazin",
 `On 24 May 1982, the worker-poet Semra Ertan set herself on fire in a Hamburg street in protest against rising racism toward Turks in Germany, having called a broadcaster beforehand to explain her act. She left behind more than 350 poems, not published in Germany until 2020.`,
 `Am 24. Mai 1982 zündete sich die Arbeiterin und Dichterin Semra Ertan auf einer Hamburger Straße selbst an, aus Protest gegen den wachsenden Rassismus gegenüber Türk:innen in Deutschland — zuvor hatte sie einen Sender angerufen, um ihre Beweggründe zu erklären. Sie hinterließ mehr als 350 Gedichte, die in Deutschland erst 2020 veröffentlicht wurden.`,
 `24 Mayıs 1982'de işçi-şair Semra Ertan, Almanya'da Türklere yönelik artan ırkçılığı protesto etmek için Hamburg'da bir sokakta kendini yaktı; eylemden önce bir radyo kurumunu arayarak nedenini açıklamıştı. Geride 350'den fazla şiir bıraktı; bunlar Almanya'da ancak 2020'de yayımlanabildi.`,
 `Semra Ertan`,`Semra Ertan`],
[1983,"MIG","Cemal Kemal Altun","30 August 1983, West Berlin: an asylum seeker who had fled Turkey after the 1980 coup, Altun fell to his death from a courthouse amid the fear of deportation and a hopeless asylum process; he became a symbol of the deportation and asylum debates.","1983_cemalkemalaltun.webp","cemal-kemal-altun-1983",0,"Elke Bruhn Hoffmann / DPA",
 `On 30 August 1983 in West Berlin, Cemal Kemal Altun — a Turkish asylum seeker facing extradition under threat of return to military-ruled Turkey — died after falling from the sixth floor of the Berlin Administrative Court during his hearing. He was the first of several Turkish asylum seekers whose deaths under threat of deportation drew national attention to Germany's asylum process.`,
 `Am 30. August 1983 starb der türkische Asylsuchende Cemal Kemal Altun in West-Berlin, nachdem er während seiner Anhörung aus dem sechsten Stock des Verwaltungsgerichts gestürzt war — er hatte eine Abschiebung in die von einer Militärregierung beherrschte Türkei befürchtet. Er war der Erste einer Reihe türkischer Asylsuchender, deren Tod unter Abschiebedruck bundesweite Aufmerksamkeit auf das deutsche Asylverfahren lenkte.`,
 `30 Ağustos 1983'te Batı Berlin'de, askeri yönetim altındaki Türkiye'ye iade tehdidiyle karşı karşıya olan sığınmacı Cemal Kemal Altun, duruşması sırasında Berlin İdare Mahkemesi'nin altıncı katından düşerek öldü. Sınır dışı edilme tehdidi altında hayatını kaybeden Türk sığınmacılar arasında, Almanya'nın iltica sürecini ulusal gündeme taşıyan ilk isimdi.`,
 `Cemal Kemal Altun`,`Cemal Kemal Altun`],
[1989,"DE-POL","Fall of the Berlin Wall","The wall dividing the two Germanys comes down.","1989_fallofberlinwall.webp","berlin-wall-fall-1989",0,"<a href=\"https://www.moma.org/artists/8594-keith-pannel-mail-on-sunday\" target=\"_blank\" rel=\"noopener\">Keith Pannel / Mail on Sunday</a>",

[1990,"DE-POL","German reunification","The BRD and the GDR unite.","1990_germany.jpg","reunification-1990",0,"Bundesarchiv",

[1992,"MIG","The Mölln arson attack","23 November 1992: Bahide Arslan, Yeliz Arslan and Ayşe Yılmaz were killed in an arson attack by the far right. A turning point in racist violence against Turks in Germany.","1992_molln.webp","molln-1992",0,"Rolf Rick / DPA",
 `On the night of 23 November 1992, two neo-Nazis firebombed two houses in Mölln; Bahide Arslan (51) and her granddaughters Yeliz Arslan (10) and Ayşe Yılmaz (14) were killed. It was the first fatal racist arson attack in reunified Germany, amid a sharp rise in violence against Turkish-Germans after 1989.`,
 `In der Nacht zum 23. November 1992 verübten zwei Neonazis Brandanschläge auf zwei Häuser in Mölln; Bahide Arslan (51) und ihre Enkelinnen Yeliz Arslan (10) und Ayşe Yılmaz (14) kamen ums Leben. Es war der erste tödliche rassistische Brandanschlag im wiedervereinigten Deutschland, inmitten eines starken Anstiegs der Gewalt gegen Türkeistämmige nach 1989.`,
 `23 Kasım 1992 gecesi, iki neo-Nazi Mölln'de iki eve molotof kokteyli attı; Bahide Arslan (51) ve torunları Yeliz Arslan (10) ile Ayşe Yılmaz (14) yaşamını yitirdi. Bu, birleşik Almanya'da ölümle sonuçlanan ilk ırkçı kundaklama saldırısıydı; 1989 sonrasında Türk kökenli Almanlara yönelik şiddetin belirgin biçimde arttığı bir dönemde gerçekleşti.`,
 `Der Brandanschlag von Mölln`,`Mölln Kundaklama Saldırısı`],
[1993,"MIG","The Solingen arson attack","29 May 1993: the home of the Genç family was set on fire in a neo-Nazi-linked attack; five people, three of them children, died. One of the most severe racist attacks in Germany.","1993_sollingen.jpg","solingen-1993",0,"Anonymous",
 `On the night of 28–29 May 1993, four young neo-Nazis set fire to the home of the Genç family in Solingen; five family members — Gürsün (27), Hatice (18), Gülüstan (12), Hülya (9), and Saime (4) — died, and fourteen others were injured. The attack triggered mass protests across Germany and remains one of the deadliest acts of racist violence in the country's postwar history.`,
 `In der Nacht vom 28. auf den 29. Mai 1993 legten vier junge Neonazis Feuer im Haus der Familie Genç in Solingen; fünf Familienmitglieder — Gürsün (27), Hatice (18), Gülüstan (12), Hülya (9) und Saime (4) — starben, vierzehn weitere wurden verletzt. Der Anschlag löste bundesweite Massenproteste aus und gilt bis heute als einer der tödlichsten rassistisch motivierten Gewaltakte der deutschen Nachkriegsgeschichte.`,

 `Der Brandanschlag von Solingen`,`Solingen Kundaklama Saldırısı`],

const Y0=1923,Y1=2026,strip=document.getElementById("strip");
const xp=y=>4+(y-Y0)/(Y1-Y0)*92;
const circs=[];const enabled={"TR-POL":true,"DE-POL":true,"MIG":true};
const groups={};EV.forEach((e,i)=>{(groups[e[0]]=groups[e[0]]||[]).push(i);});
const years=Object.keys(groups).map(Number).sort((a,b)=>a-b);
let lastx=-9;
years.forEach(y=>{let x=xp(y);if(x-lastx<3.6)x=lastx+3.7;lastx=x;
  const g=document.createElement("div");g.className="ygroup";g.style.left=x+"%";
  groups[y].forEach((i,k)=>{const e=EV[i];
    const c=document.createElement("div");c.className="circ"+(e[4]?"":" noimg")+(k>0?" stack":"");
    c.style.setProperty("--cc",CLR[e[1]]);c.style.setProperty("--k",k);
    if(e[4])c.style.backgroundImage=`url('${IMG}${e[4]}')`;
    c.innerHTML=`<div class="cov"><span>${e[0]}</span></div>`;
    c.dataset.flow=e[1];c.onclick=(ev)=>{ev.stopPropagation();sel(i);};
    g.appendChild(c);circs[i]=c;});
  strip.appendChild(g);});
const stage=document.getElementById("stage"),bg=document.getElementById("bg"),tear=document.getElementById("tear"),
ghost=document.getElementById("ghost"),kick=document.getElementById("kick"),
title=document.getElementById("title"),note=document.getElementById("note"),
desclang=document.getElementById("desclang"),desc=document.getElementById("desc"),
go=document.getElementById("go"),photoby=document.getElementById("photoby");

/* ---- torn photo edges are now authored in After Effects (FT Torn Paper Pro) and exported
   per-photo as PNG/WebP with a real alpha-transparent rip — same filename, dropped into
   events/img/ in place of the original. No procedural clip-path here: #paperback (bone,
   behind #bg/#tear) just shows through wherever the exported image's alpha is torn away.
   Photos not yet re-exported simply show flush/rectangular, which is a fine fallback. ---- */
const cracksvg=document.getElementById("cracksvg");
function scratchWalk(segments,x,y,angle,len,depth){
  if(depth<=0||len<3)return;
  const steps=5+Math.floor(Math.random()*3);
  let cx=x,cy=y,ang=angle;
  for(let i=0;i<steps;i++){
    ang+=(Math.random()-0.5)*0.22;
    const segLen=(len/steps)*(0.85+Math.random()*0.3);
    const nx=cx+Math.cos(ang)*segLen,ny=cy+Math.sin(ang)*segLen;
    segments.push({x1:cx,y1:cy,x2:nx,y2:ny});
    cx=nx;cy=ny;
    if(Math.random()<0.08&&depth>1)scratchWalk(segments,cx,cy,ang+(Math.random()-0.5)*0.9,len*0.4,depth-1);
  }
  scratchWalk(segments,cx,cy,ang,len*0.3,depth-1);
}
function genCracks(){
  while(cracksvg.lastChild)cracksvg.removeChild(cracksvg.lastChild);
  const segments=[],numScratches=1+Math.floor(Math.random()*2);
  for(let t=0;t<numScratches;t++){
    const edge=Math.floor(Math.random()*4);
    let sx,sy;
    if(edge===0){sx=Math.random()*100;sy=Math.random()*6;}
    else if(edge===1){sx=100-Math.random()*6;sy=Math.random()*100;}
    else if(edge===2){sx=Math.random()*100;sy=100-Math.random()*6;}
    else{sx=Math.random()*6;sy=Math.random()*100;}
    const angle=Math.atan2(50-sy,50-sx)+(Math.random()-0.5)*0.7;
    scratchWalk(segments,sx,sy,angle,120,2);
  }
  const d=segments.map(s=>`M${s.x1.toFixed(2)},${s.y1.toFixed(2)} L${s.x2.toFixed(2)},${s.y2.toFixed(2)}`).join(" ");
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d",d);
  p.setAttribute("stroke","rgba(255,251,240,.75)");
  p.setAttribute("stroke-width","0.22");
  p.setAttribute("fill","none");
  p.setAttribute("stroke-linecap","round");
  cracksvg.appendChild(p);
  const dustCount=16+Math.floor(Math.random()*14);
  for(let i=0;i<dustCount;i++){
    const dot=document.createElementNS("http://www.w3.org/2000/svg","circle");
    dot.setAttribute("cx",(Math.random()*100).toFixed(2));
    dot.setAttribute("cy",(Math.random()*100).toFixed(2));
    dot.setAttribute("r",(0.12+Math.random()*0.3).toFixed(2));
    dot.setAttribute("fill","rgba(255,252,244,.8)");
    cracksvg.appendChild(dot);
  }
}
let fxRaf=null,fxGen=0;
function playEffects(e,totalMs){
  const gen=++fxGen;
  cancelAnimationFrame(fxRaf);
  stage.style.setProperty("--age","0");
  genCracks();
  const url=e[4]?`url('${IMG}${e[4]}')`:null;
  if(!url){bg.style.backgroundImage="none";tear.style.opacity="0";return;}
  tear.style.backgroundImage=url;
  tear.style.opacity="0";
  const t0=performance.now(),crossMs=Math.min(500,totalMs*0.3);
  let swapped=false;
  const step=(t)=>{
    if(gen!==fxGen)return;
    const el=t-t0,age=Math.min(1,el/totalMs);
    stage.style.setProperty("--age",age.toFixed(4));
    if(!swapped){
      tear.style.opacity=Math.min(1,el/crossMs).toFixed(3);
      if(el>=crossMs){bg.style.backgroundImage=url;tear.style.opacity="0";swapped=true;}
    }
    if(age<1)fxRaf=requestAnimationFrame(step);
  };
  fxRaf=requestAnimationFrame(step);
}

/* ---- EN/DE/TR "letters morph in place" typewriter (scramble-then-lock, not erase/retype) ---- */
const CHARS="!<>-_/\\[]{}=+*^?#×~üşğıöçßÜ";
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
class Scrambler{
  constructor(el){this.el=el;this.raf=null;this.q=[];this.frame=0;this.gen=0;}
  to(newText,ms=750){
    const myGen=++this.gen,oldText=this.el.textContent||"";
    const len=Math.max(oldText.length,newText.length),durFrames=Math.max(10,Math.round(ms/16.7));
    this.q=[];
    for(let i=0;i<len;i++){
      const from=oldText[i]||"",to=newText[i]||"";
      const start=Math.floor((i/Math.max(1,len))*durFrames*0.55);
      const end=start+Math.round(durFrames*0.45)+((Math.random()*durFrames*0.15)|0);
      this.q.push({from,to,start,end,char:""});}
    cancelAnimationFrame(this.raf);this.frame=0;
    return new Promise(resolve=>{
      const step=()=>{
        if(myGen!==this.gen)return resolve();
        let out="",done=0;
        for(const q of this.q){
          if(this.frame>=q.end){done++;out+=esc(q.to);}
          else if(this.frame>=q.start){
            if(!q.char||Math.random()<0.3)q.char=CHARS[(Math.random()*CHARS.length)|0];
            out+=`<span class="dud">${esc(q.char)}</span>`;}
          else out+=esc(q.from);}
        this.el.innerHTML=out;
        if(done>=this.q.length)resolve();
        else{this.frame++;this.raf=requestAnimationFrame(step);}};
      step();});}
}
const scrambler=new Scrambler(document.getElementById("descText"));
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function timingFor(e){
  const langs=[e[8]||"",e[9]||"",e[10]||""];
  const titles=[e[2]||"",e[11]||"",e[12]||""];
  const holds=langs.map(t=>Math.min(8500,Math.max(2200,t.length*34)));
  const trans=5750;
  return {langs,titles,holds,trans,total:holds[0]+trans+holds[1]+trans+holds[2]};
}
let descGen=0;
function playDesc(e,T){
  const gen=++descGen,alive=()=>gen===descGen,tags=["EN","DE","TR"];
  (async()=>{
    for(let li=0;li<3;li++){
      if(!alive())return;
      desclang.textContent=tags[li];
      title.textContent=T.titles[li];
      await scrambler.to(T.langs[li],T.trans);
      if(!alive())return;
      await sleep(T.holds[li]);
    }
  })();
}

function rollYear(to){cancelAnimationFrame(rollYear._raf);const from=rollYear._last??Y0,t0=performance.now(),dur=560;
  (function step(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    ghost.textContent=Math.round(from+(to-from)*e);if(p<1)rollYear._raf=requestAnimationFrame(step);else ghost.textContent=to;})(t0);
  rollYear._last=to;}

function sel(i){const e=EV[i];
  const T=timingFor(e);
  playEffects(e,T.total);
  playDesc(e,T);
  rollYear(e[0]);ghost.style.color=CLR[e[1]];
  kick.innerHTML=`<span style="color:${CLR[e[1]]}">${LBL[e[1]]}</span> · ${e[0]}`;
  note.textContent=e[3];
  if(e[6]){go.href=`events/${e[5]}.html`;go.style.pointerEvents="";go.style.opacity="";}
  else{go.removeAttribute("href");go.style.pointerEvents="none";go.style.opacity=".55";}
  photoby.innerHTML=e[7]?("IMAGE · "+e[7]):"";
  circs.forEach((c,k)=>c&&c.classList.toggle("on",k===i));}
document.querySelectorAll("#legend span").forEach(sp=>{sp.onclick=()=>{const f=sp.dataset.flow;enabled[f]=!enabled[f];sp.classList.toggle("off",!enabled[f]);
  EV.forEach((e,i)=>{if(circs[i])circs[i].style.display=enabled[e[1]]?"":"none";});};});
(function(){var m=document.createElement('div');m.id='mobile';
var h='<div class="m-hero"><h1>Shared History</h1><div class="sub">1923 — 2026</div></div>';
EV.forEach(function(e){h+='<div class="m-card" style="--cc:'+CLR[e[1]]+'"><div class="yr">'+e[0]+'</div><span class="tag">'+LBL[e[1]]+'</span>'+(e[4]?'<img loading="lazy" src="'+IMG+e[4]+'" alt="">':'')+'<h3>'+e[2]+'</h3><p>'+e[3]+'</p>'+(e[7]?'<div class="cr">IMAGE · '+e[7]+'</div>':'')+'</div>';});
m.innerHTML=h;document.body.appendChild(m);})();
sel(8);
